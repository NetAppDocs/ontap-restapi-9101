      operations, such as creating point-in-time snapshots with write-fences. Use
      these endpoints to perform operations on applications with datasets spanning
      multiple volumes, ensuring data consistency across the group.
- id: manage application consistency group snapshot copies
  permalink: manage_application_consistency_group_snapshot_copies.html
