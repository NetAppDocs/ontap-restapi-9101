root_overview:
  ai-gen:
    keywords: ontap rest, storage management, http methods, hal linking, query parameters
    lead: The ONTAP REST API offers a comprehensive set of endpoints designed to help
      you manage and automate your storage systems efficiently. This documentation
      provides detailed information on how to use these API calls, including examples
      and descriptions of required properties, enabling seamless integration and control
      over your storage infrastructure.
categories:
- id: cloud
  title: ONTAP REST API cloud endpoints
  permalink: cloud_endpoints.html
  ai-gen:
    keywords: cloud management,object storage,cloud targets,data storage,ontap cloud,cloud
      integration
    lead: Manage cloud object storage targets to integrate and optimize your ONTAP
      environment with cloud services.
- id: cluster
  title: ONTAP REST API cluster endpoints
  permalink: cluster_endpoints.html
  ai-gen:
    keywords: cluster creation,cluster configuration,node management,node discovery,software
      update,job monitoring
    lead: Cluster endpoints support a variety of workflows such as creating the cluster,
      adding nodes, and managing configuration data for both clusters and nodes. Utilize
      these APIs to discover and integrate nodes, handle job updates, and upgrade
      cluster software efficiently. Certain endpoints are accessible even before cluster
      creation, aiding in setup and monitoring tasks.
- id: networking
  title: ONTAP REST API networking endpoints
  permalink: networking_endpoints.html
  ai-gen:
    keywords: networking information, ipspaces, broadcast domains, fibre channel,
      service policies, routes
    lead: The networking endpoints provide access to network configuration and status,
      including IPspaces, interfaces, routes, ports, service policies, and broadcast
      domains. Use these endpoints to report and manage various aspects of your network
      setup within ONTAP.
- id: svm
  title: ONTAP REST API svm endpoints
  permalink: svm_endpoints.html
  ai-gen:
    keywords: storage virtual machine,nfs configuration,cifs configuration,export
      policies,name mappings,junction paths
    lead: Use SVM endpoints to manage Storage Virtual Machines and their attributes,
      including protocol configurations, export policies, and network services. These
      endpoints help securely isolate and independently manage virtualized data storage
      and network environments within a cluster.
- id: name-services
  title: ONTAP REST API name-services endpoints
  permalink: name-services_endpoints.html
  ai-gen:
    keywords: name services,nis configuration,ldap configuration,dns resolution,ns
      switch
    lead: Name-services endpoints in ONTAP facilitate retrieving user and client information
      essential for authenticating data access and administration tasks. Utilize these
      endpoints to configure NIS and LDAP name services and manage DNS settings for
      hostname resolution within your storage environment.
- id: san
  title: ONTAP REST API SAN endpoints
  permalink: san_endpoints.html
  ai-gen:
    keywords: fibre channel,world wide port name,iscsi initiator,initiator group,lun
      map,vvol bindings
    lead: Configure, provision, and manage SAN-related objects using the storage area
      network (SAN) endpoints. These endpoints facilitate essential operations for
      SAN environments, supporting tasks like Fibre Channel and iSCSI service management,
      LUN provisioning, and initiator group configuration.
- id: nvme
  title: ONTAP REST API NVMe endpoints
  permalink: nvme_endpoints.html
  ai-gen:
    keywords: nvme configuration,nvme management,fibre channel logins,nvme interfaces,nvme
      subsystems
    lead: Configure, provision, and manage NVMe-related objects using these endpoints.
      Utilize them to support NVMe and NVMe over Fabrics protocols for efficient storage
      operations and connectivity.
- id: application
  title: ONTAP REST API application endpoints
  permalink: application_endpoints.html
  ai-gen:
    keywords: application management,storage provisioning,application templates,protocol
      access,smart container
    lead: Explore ONTAP application endpoints for streamlined storage management using
      application-specific terminology. These endpoints enable you to provision and
      manage ONTAP storage objects, offering protocol access and the ability to view
      and manage related objects as a cohesive group. Templates are available for
      various database and virtualization applications, ensuring alignment with NetApp
      best practices.
- id: support
  title: ONTAP REST API support endpoints
  permalink: support_endpoints.html
  ai-gen:
    keywords: configuration backups,autosupport settings,event handling,node settings,cluster
      settings
    lead: Use support endpoints to manage configuration backups, autosupport settings,
      and event handling. Configuration backups safeguard node and cluster settings
      by saving copies to an external server, crucial for single-node cluster integrity.
- id: security
  title: ONTAP REST API security endpoints
  permalink: security_endpoints.html
  ai-gen:
    keywords: security settings,cluster management,SVM security,SAML configuration,multi-factor
      authentication
    lead: Use ONTAP security endpoints to manage security settings for both the cluster
      and SVMs. These APIs facilitate configuration of authentication protocols, such
      as SAML, to enhance secure access through third-party Identity Providers.
- id: storage
  title: ONTAP REST API storage endpoints
  permalink: storage_endpoints.html
  ai-gen:
    keywords: storage management,physical storage,logical storage,volume management,snapshot
      management,storage efficiency
    lead: Use ONTAP storage APIs to manage both physical and logical storage components.
      Handle aggregates, volumes, LUNs, qtrees, snapshots, quotas, and storage efficiency
      within your environment.
- id: snapmirror
  title: ONTAP REST API snapmirror endpoints
  permalink: snapmirror_endpoints.html
  ai-gen:
    keywords: snapmirror technology,backup relationship,disaster recovery,restore
      relationships,data transfers
    lead: SnapMirror endpoints facilitate the creation and management of SnapMirror
      relationships to copy and backup production data efficiently. Utilize these
      endpoints to establish async and sync relationships, manage restore-relationships,
      and control data transfers, ensuring up-to-date replicas for disaster recovery
      and data restoration.
- id: ndmp
  title: ONTAP REST API ndmp endpoints
  permalink: ndmp_endpoints.html
  ai-gen:
    keywords: ndmp backup,network data management,ontap ndmp,svm aware,volume mobility
    lead: Utilize NDMP endpoints to efficiently manage network-based backups for NAS
      systems. These endpoints provide standard commands for backing up and restoring
      file servers, optimizing data protection by enabling direct data transfers to
      tape storage.
- id: snaplock
  title: ONTAP REST API snaplock endpoints
  permalink: snaplock_endpoints.html
  ai-gen:
    keywords: snaplock storage,snaplock retention,worm data protection,legal hold,snaplock
      privileged delete
    lead: Utilize SnapLock endpoints to manage read-only WORM data storage with enforced
      retention and legal compliance. Protect data in regulatory environments with
      granular file-level controls for retention, privileged deletion, and legal holds.
- id: nas
  title: ONTAP REST API NAS endpoints
  permalink: nas_endpoints.html
  ai-gen:
    keywords: nfs server,export policies,nfs configuration,kerberos realms,export
      rules,kerberos configuration
    lead: Use NAS endpoints to create and manage NFS servers and export policies for
      Storage Virtual Machines (SVMs). These APIs let you configure NFS settings,
      apply export rules, and establish Kerberos authentication to secure access in
      your ONTAP environment.
subcategories:
- id: manage application snapshot copies
  permalink: manage_application_snapshot_copies.html
  ai-gen:
    keywords: snapshot management,crash consistent,snapshot scheduling,application
      consistent,rpo setting
    lead: Manage application Snapshot copies to create and restore images of storage
      elements at any desired or scheduled time. Most applications have hourly Snapshot
      copies by default, unless modified during application creation. While these
      APIs are not integrated with host applications, using the SnapCenter Backup
      Management suite is recommended for optimal interaction.
